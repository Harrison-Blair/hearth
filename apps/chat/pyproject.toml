[project]
name = "hearth-chat"
version = "0.1.0"
description = "Console chat client for hearth"
requires-python = ">=3.14"
dependencies = [
    "hearth-protocol",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0",
    "websockets>=15.0",
]

[project.scripts]
hearth-chat = "hearth.chat.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hearth.chat"

[tool.uv.sources]
hearth-protocol = { workspace = true }
