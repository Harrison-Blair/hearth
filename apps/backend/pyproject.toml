[project]
name = "hearth-backend"
version = "0.1.0"
description = "WebSocket assistant backend"
requires-python = ">=3.14"
dependencies = [
    "hearth-protocol",
    "openai>=2.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.16",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "websockets>=15.0",
]

[project.scripts]
hearth-backend = "hearth.backend.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hearth.backend"

[tool.uv.sources]
hearth-protocol = { workspace = true }
